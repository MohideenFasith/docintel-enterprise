[build-system]
requires = ["setuptools==84.0.0", "wheel>=0.45"]
build-backend = "setuptools.build_meta"

[project]
name = "docintel-enterprise"
version = "0.3.0"
description = "Document intelligence backend with extraction, chunking, lexical retrieval, security, audit, metrics and workflow routing."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.128.2",
  "uvicorn==0.48.0",
  "pydantic==2.13.4",
  "pydantic-settings==2.14.1",
  "prometheus-client==0.25.0",
  "python-json-logger==4.0.0",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "ruff==0.16.3",
  "mypy==2.3.1",
  "pip-audit==2.10.1",
]

observability = ["sentry-sdk==2.68.0"]

[project.scripts]
docintel = "docintel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
branch = true
source = ["docintel"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
packages = ["docintel"]
strict = true
warn_unused_ignores = true
