name: ci
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install
        run: pip install -r requirements-dev.lock -e . --no-deps
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy src
      - name: Test with coverage
        run: pytest -q --cov=docintel --cov-report=term-missing --cov-fail-under=80
      - name: Dependency audit
        run: pip-audit -r requirements.lock
